apiVersion: v1
kind: Pod
metadata:
  name: ${PREWARM_POD}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: prime-rl-mm-prewarm
    prime-rl.nvidia.com/run-id: ${RUN_ID}
spec:
  restartPolicy: Never
  imagePullSecrets:
    - name: ngc-pull-secret
  nodeSelector:
    kubernetes.io/hostname: ${TRAINER_NODE_NAME}
  containers:
    - name: prewarm
      image: ${BASE_IMAGE}
      imagePullPolicy: IfNotPresent
      command: ["/bin/true"]
