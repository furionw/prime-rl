# Usage: uv run rl @ examples/reverse_text/rl.toml @ examples/reverse_text/dynamo_multinode_aggregated_rl.toml @ examples/reverse_text/slurm_rl.toml

[weight_broadcast]
type = "nccl"

[trainer]

[orchestrator]

[slurm]

[deployment]
type = "multi_node"
gpus_per_node = 1
num_train_nodes = 1
num_infer_nodes = 1

[inference.backend]
type = "dynamo"

[inference.parallel]
tp = 1
dp = 1

[inference.deployment]
type = "single_node"
gpus_per_node = 1
